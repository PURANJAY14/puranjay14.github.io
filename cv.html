<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CV - Puranjay Datta</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
  <link rel="stylesheet" href="style.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Newsreader:opsz,wght@6..72,400;6..72,500;6..72,600&display=swap" rel="stylesheet">
</head>

<body>
    <!-- Applies the saved theme (dark by default) before first paint, so the
         page never flashes the wrong background. Full logic lives in main.js. -->
    <script>
      (function () {
        try {
          if (localStorage.getItem('theme') !== 'light') {
            document.body.classList.add('dark-mode');
          }
        } catch (e) {}
      })();
    </script>
  <div class="sidebar">
    <div class="logo">
      <h1>Puranjay Datta</h1>
    </div>
    <nav>
      <ul>
        <li><a href="index.html"><i class="fas fa-home"></i> Home</a></li>
        <li><a href="index.html#research"><i class="fas fa-flask"></i> Research</a></li>
        <li><a href="resources.html"><i class="fas fa-book-open"></i> Resources</a></li>
        <li><a href="cv.html" class="active"><i class="fas fa-file-alt"></i> CV</a></li>
      </ul>
    </nav>
    <div class="theme-switcher">
      <i class="fas fa-sun"></i>
      <label class="switch">
        <input type="checkbox">
        <span class="slider round"></span>
      </label>
      <i class="fas fa-moon"></i>
    </div>
  </div>

  <div class="main-content">
    <section id="cv">
        <div class="container">
            <div class="cv-header">
                <h2>Curriculum Vitae</h2>
                <a class="cv-download" href="public/CV.pdf" download>
                    <i class="fas fa-download"></i> Download PDF
                </a>
            </div>
            <div class="pdf-viewer-container">
                <iframe src="public/CV.pdf" width="100%" height="100%" style="border: none;"
                        title="Curriculum vitae of Puranjay Datta"></iframe>
            </div>
        </div>

        <footer>
          <div class="container">
            <p>&copy; 2025 Puranjay Datta</p>
          </div>
        </footer>
    </section>
  </div>

  <script src="main.js"></script>
</body>

</html>
